<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Pickleball Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="score-container">

        <div id="team1-panel" class="team-panel team-1">
            <h2 class="team-title">Team 1</h2>
            <div class="score-control">
                <button class="adjust-btn minus-btn" onclick="adjustScore(1, -1)">-</button>
                <div class="score" id="score-team1">0</div>
                <button class="adjust-btn plus-btn" onclick="adjustScore(1, 1)">+</button>
            </div>
        </div>

        <div id="team2-panel" class="team-panel team-2">
            <h2 class="team-title">Team 2</h2>
            <div class="score-control">
                <button class="adjust-btn minus-btn" onclick="adjustScore(2, -1)">-</button>
                <div class="score" id="score-team2">0</div>
                <button class="adjust-btn plus-btn" onclick="adjustScore(2, 1)">+</button>
            </div>
        </div>

    </main>

    <button class="reset-btn" onclick="resetGame()">RESET GAME</button>

    <script src="script.js"></script>
</body>
</html>
